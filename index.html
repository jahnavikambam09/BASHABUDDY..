<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BhashaBuddy: VoiceBridge Jam</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Noto+Sans+Telugu:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="blobs" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

  <header class="topbar">
    <div class="brand"><span class="brand-mark">भ</span> BhashaBuddy</div>
    <nav class="lang-pill" id="langPill" aria-label="Language">
      <button data-lang="en" class="active">English</button>
      <button data-lang="te">తెలుగు</button>
      <button data-lang="hi">हिंदी</button>
      <button data-lang="ta">தமிழ்</button>
    </nav>
  </header>

  <main class="wrap">
    <section class="hero">
      <h1 data-i18n="heroTitle"></h1>
      <p data-i18n="heroSub"></p>
    </section>

    <!-- Stats -->
    <section class="stats">
      <div class="stat goal">
        <svg viewBox="0 0 80 80" class="ring-sm" aria-hidden="true">
          <circle cx="40" cy="40" r="34" class="ring-bg" />
          <circle cx="40" cy="40" r="34" class="ring-fg" id="goalRing" />
        </svg>
        <div class="goal-text">
          <strong id="goalCount">2/5</strong>
          <span data-i18n="words"></span>
        </div>
        <div class="stat-label" data-i18n="dailyGoal"></div>
      </div>
      <div class="stat streak">
        <div class="big"><span class="emoji">🔥</span><strong id="streakNum">3</strong></div>
        <div class="stat-label" data-i18n="streak"></div>
      </div>
      <div class="stat points">
        <div class="big"><span class="emoji">⭐</span><strong id="pointsNum">120</strong></div>
        <div class="stat-label" data-i18n="points"></div>
      </div>
    </section>

    <!-- Tabs -->
    <div class="tabs" role="tablist">
      <button class="tab active" data-tab="learn" data-i18n="tabLearn"></button>
      <button class="tab" data-tab="quiz" data-i18n="tabQuiz"></button>
      <button class="tab" data-tab="buddy" data-i18n="tabBuddy"></button>
    </div>

    <!-- LEARN -->
    <section id="tab-learn" class="panel active">
      <div class="learn-grid">
        <div>
          <div class="deck-meta">
            <span id="cardCounter"></span>
            <span class="hint" data-i18n="flipHint"></span>
          </div>
          <div class="card-wrap">
            <div class="card" id="card" tabindex="0" role="button" aria-label="Flashcard">
              <div class="face front" id="cardFront"></div>
              <div class="face back" id="cardBack"></div>
            </div>
          </div>

          <div class="controls">
            <button class="btn ghost" id="prevBtn"><span data-i18n="prev"></span></button>
            <div class="listen-box">
              <div class="eq" id="eqListen"></div>
              <button class="btn primary" id="listenBtn">🔊 <span data-i18n="listen"></span></button>
              <div class="speed" id="speedToggle">
                <button data-speed="1" class="active" data-i18n="normal"></button>
                <button data-speed="0.7" data-i18n="slow"></button>
              </div>
            </div>
            <button class="btn ghost" id="nextBtn"><span data-i18n="next"></span></button>
          </div>
        </div>

        <aside class="studio">
          <h2 data-i18n="studioTitle"></h2>
          <p class="muted" data-i18n="studioHint"></p>

          <div class="gauge">
            <svg viewBox="0 0 140 140" aria-hidden="true">
              <circle cx="70" cy="70" r="54" class="g-bg" />
              <circle cx="70" cy="70" r="54" class="g-fg" id="gaugeFg" />
            </svg>
            <div class="g-center">
              <strong id="gaugeNum">0%</strong>
              <span data-i18n="match"></span>
            </div>
          </div>

          <div class="eq eq-mic" id="eqMic"></div>
          <button class="btn mic" id="micBtn">🎙️ <span id="micLabel" data-i18n="speak"></span></button>

          <p class="heard" id="heardLine" aria-live="polite"></p>
          <p class="feedback" id="feedback" aria-live="polite"></p>

          <details class="fallback" id="fallback">
            <summary data-i18n="fallbackTitle"></summary>
            <p class="muted" data-i18n="fallbackHint"></p>
            <div class="fb-row">
              <input id="typeInput" type="text" autocomplete="off" data-i18n-ph="typePh" />
              <button class="btn small" id="checkBtn" data-i18n="check"></button>
            </div>
            <button class="btn small outline" id="simBtn" data-i18n="simulate"></button>
          </details>
        </aside>
      </div>
    </section>

    <!-- QUIZ -->
    <section id="tab-quiz" class="panel">
      <div class="quiz" id="quizBox"></div>
    </section>

    <!-- BUDDY -->
    <section id="tab-buddy" class="panel">
      <div class="chat">
        <div class="chat-head">
          <span class="avatar">🤝</span>
          <strong data-i18n="buddyTitle"></strong>
        </div>
        <div class="chat-log" id="chatLog">
          <div class="bubble bot" data-i18n="chatHello"></div>
        </div>
        <div class="chips" id="chips">
          <button data-topic="interview" data-i18n="chipInterview"></button>
          <button data-topic="pron" data-i18n="chipPron"></button>
          <button data-topic="algo" data-i18n="chipAlgo"></button>
        </div>
        <div class="chat-input">
          <input id="chatInput" type="text" autocomplete="off" data-i18n-ph="askPh" />
          <button class="btn primary small" id="sendBtn" data-i18n="send"></button>
        </div>
      </div>
    </section>

    <footer class="foot">
      <button class="link" id="resetBtn" data-i18n="reset"></button>
    </footer>
  </main>

  <div class="confetti" id="confetti" aria-hidden="true"></div>
  <div class="toast" id="toast" role="status"></div>

  <script src="script.js"></script>
</body>
</html>
